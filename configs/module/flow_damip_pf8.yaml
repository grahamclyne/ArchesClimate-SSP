project: cmip-interpolation-flow  # wandb/checkpoint namespace: model_output/<project>/<name>
surface_variables: ['tas','psl','pr','uas','vas','ps','net_flux','evspsbl']  # single-level surface fields predicted (channel order matters)
depth_variables: ['thetao']  # ocean 'lev' fields predicted, stacked over depth_levels
level_variables: ["hus", "ta", "ua", "va", "zg"]  # atmospheric fields predicted, stacked over pressure_levels
pressure_levels: [100000.,  92500.,  85000.,  70000.,  60000.,  50000.,  40000.,  30000., 25000.,  20000.,  15000.,  10000.,   7000.,   5000.,   3000.,   2000.,1000.]  # pressure levels (Pa) level_variables are stacked on
depth_levels: [0.50576,3.8562799,8.092519,13.991038,22.757616,35.740204,53.850636,77.61116,108.03028, 147.40625,]  # ocean depth levels (m) depth_variables are stacked on
norm_scheme: new_ozone  # suffix of the stats/cmip_stats_<name>.pt normalization file to use
train_filter: ['piControl','historical','ssp119','ssp126','ssp245','ssp370','ssp460']  # CMIP6 experiments included in the training split
test_filter: ['ssp585']  # CMIP6 experiment(s) used for the held-out test split
val_filter: ['ssp434']  # CMIP6 experiment(s) used for the validation split
spatial_forcing_variables: ['methane','carbon','nitrous','load_ASNO3M','load_CSNO3M','load_CINO3M','load_SO4','load_AIBCM','load_ASBCM','ozone_0','ozone_1','ozone_2','ozone_3','ozone_4','ozone_5','ozone_6','ozone_7','ozone_8','ozone_9','ozone_10']  # 2-D forcing channels (GHGs, aerosols, ozone bands) fed to the model
non_spatial_forcing_variables: ['ssi_0','ssi_1','ssi_2','ssi_3','ssi_4','ssi_5']  # scalar (non-gridded) forcing channels, e.g. solar/SSI bands
dataset_path: memmap_filled_in  # memmap directory (under cluster.data_path) this config reads training data from
lead_times: [1] # match the damip det model - no random lead time sampling
skip_pf: true  # DCPPDiffusion never reads pf_future_states/has_pf -- only ForecastModuleWithCond's training_step does. Skips 8 wasted memmap reads/clones per sample.
module:  # Lightning module class and its training hyperparameters
  _target_: ArchesClimate.model.diffusion.DCPPDiffusion  # Hydra target class to instantiate
  name: ${name}  # run name, interpolated from the CLI's name= override
  cond_dim: 512  # dimensionality of the per-token conditioning embedding
  prediction_type: v-pred  # diffusion objective ('v-pred' = velocity/v-parameterization target)
  scheduler: flow  # diffusion/flow noise scheduler ('flow', 'ddpm', 'heun', ...)
  snr_gamma: 0  # min-SNR loss-weighting gamma (0 disables it)
  beta_schedule: squaredcos_cap_v2  # noise schedule shape for the diffusion scheduler
  conditional: prev+det+forcings  # what the model conditions on, e.g. 'prev+forcings' or 'prev+det+forcings'
  uncond_proba: 0.0  # probability of dropping all conditioning during training (classifier-free-guidance style)
  forcing_drop_p: 0.20  # per-channel probability of randomly dropping an individual forcing during training
  # Matches deterministic_damip_pf8.yaml's forcing_all_present_prob (0.60),
  # the det model this flow model wraps (load_deterministic_model below) --
  # the flow_damip_pf8_fixed run instead used 0.40, a mismatch from its own
  # conditioning det model that skews the residual head's training
  # distribution away from what it sees at rollout time (forcings always
  # fully present in a real SSP trajectory).
  forcing_all_present_prob: 0.60  # probability every forcing channel is present (no dropout) for a given sample
  lr: 1e-4  # base learning rate (unused when optimizer_name selects muon_lr/adamw_lr instead)
  betas: [0.9, 0.98]  # Adam(W) momentum coefficients
  weight_decay: 0.05  # AdamW/Muon weight decay
  num_warmup_steps: 5000  # linear LR warmup steps before the schedule proper starts
  num_training_steps: ${max_steps}  # total scheduled training steps, interpolated from max_steps
  num_inference_steps: ${inference.num_inference_steps}  # denoising steps taken per rollout step at inference
  num_batch_examples: ${inference.num_batch_examples}  # batch size at inference time
  num_members: ${inference.num_members}  # ensemble members sampled per rollout at inference
  num_rollout_steps: ${inference.num_rollout_steps}  # number of autoregressive steps in an inference rollout
  s_churn: ${inference.s_churn}  # stochastic-sampler churn parameter (extra noise injected during denoising)
  stochastic_sampling: ${inference.stochastic_sampling}  # use a stochastic (vs. deterministic ODE) sampler
  scale_input_noise: ${inference.scale_input_noise}  # scale the initial noise sample before denoising
  cf_guidance: ${inference.cf_guidance}  # classifier-free-guidance scale applied at inference
  # Unlike s_churn/scale_input_noise/cf_guidance above, this was previously
  # never wired to inference.add_stochastic_noise -- DCPPDiffusion.__init__'s
  # hardcoded default (False) was used regardless of any CLI override,
  # silently making inference.add_stochastic_noise=True a no-op at rollout
  # time (confirmed: two rollouts differing only in that flag produced
  # byte-identical output files).
  add_stochastic_noise: ${inference.add_stochastic_noise}  # add extra stochastic noise between rollout steps at inference
  learn_residual: pred  # predict a residual relative to the deterministic model's own prediction
  state_normalization: True  # normalize state channels before feeding the residual head
  # deterministic_damip_pf8_fixed is the canonical, black-carbon-clamp-
  # validated pf8 det model (see CLAUDE.md) -- this is what
  # flow_damip_pf8_fixed was actually trained against (confirmed from its
  # saved config.yaml / submission log), not the forcing_dropout_no_random_lt
  # det model this file was copied from.
  load_deterministic_model: /scratch/gclyne/model_output/cmip-interpolation/deterministic_damip_pf8_fixed  # checkpoint dir of the frozen deterministic model this flow model conditions on
  det_ckpt_fname: "step-step=022000.ckpt"  # checkpoint filename loaded from load_deterministic_model
  load_prev: 1  # number of previous timesteps concatenated as model input
  delta_std_name: cmip_delta_std_deterministic_damip_pf8_fixed  # stats/cmip_delta_std_<name> file: the deterministic model's residual-magnitude stats
  optimizer_name: muon  # optimizer used for the backbone ('muon' or 'adamw')
  muon_lr: 2e-4  # learning rate for Muon-optimized parameters
  adamw_lr: 5e-5  # learning rate for AdamW-optimized (non-Muon) parameters
  # deterministic_damip_pf8.yaml trains its det model with ema_decay: 0.999;
  # this flow config previously left ema_decay unset (defaults to 0.0 in
  # DCPPDiffusion.__init__), which never instantiates self._ema at all --
  # despite the "_ema" rollout output suffix, that run's checkpoints were raw,
  # un-smoothed weights. Matching the det model's decay here.
  ema_decay: 0.999  # exponential moving average decay rate for the EMA weight copy

backbone:  # spatial network architecture
  # default backbone
  _target_: ArchesClimate.backbones.archesweather.ArchesWeatherCondBackbone  # Hydra target class to instantiate
  tensor_size: [1,72,72] # after embed
  emb_dim: 384  # internal embedding dimension (must match across backbone/embedder)
  cond_dim: 512  # dimensionality of the per-token conditioning embedding
  window_size: [1, 6, 10]  # windowed-attention window size (level, lat, lon), in patches
  droppath_coeff: 0.2  # stochastic depth (DropPath) rate
  dropout: 0  # attention/MLP dropout rate
  depth_multiplier: 2  # attention blocks per stage, relative to the base depth
  use_skip: True  # concatenate the first stage's output as a skip connection into the last stage
  first_interaction_layer: False  # add an extra linear mixing layer before the first attention stage
  axis_attn: False  # use axis-factorized attention instead of full windowed attention
  mlp_layer: swiglu  # MLP block type used inside each attention block
  mlp_ratio: 4.0  # MLP hidden-dimension ratio relative to emb_dim

embedder:  # patch encoder/decoder wrapping the backbone
  _target_: ArchesClimate.model.cmip_encoder_decoder.CMIPEncodeDecodeLayer  # Hydra target class to instantiate
  img_size: [216,144,144]  # (channels, lat, lon) shape the encoder/decoder expects (channels set at instantiate() time)
  emb_dim: 384  # internal embedding dimension (must match across backbone/embedder)
  out_emb_dim: 768 # 2x because of skip
  patch_size: [2, 2, 2]  # (level, lat, lon) patch size for the initial patch embedding
  n_concatenated_states: 2 # prev and pred
