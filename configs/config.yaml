defaults:
  - cluster: ???
  - dataloader: cmip_random_lead_times
  - module: ???
  - inference: cmip_80_year
  - analysis: base
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

log: True # wandb logging
name: new_ozone_0
project: ${module.project}
exp_dir: ${cluster.output_path}model_output/${module.project}/${name}
model_dir: ${cluster.output_path}model_output/${module.project}/${name}

seed: 0
max_steps: 22000
max_epochs: 30
batch_size: ${cluster.batch_size}
resume: True
warmstart_ckpt_path: null  # path to a checkpoint from a different model to warm-start from (restores weights + global_step)
# True (default): warmstart_ckpt_path goes through trainer.fit(ckpt_path=...), Lightning's
# full-state resume -- requires the checkpoint's model AND optimizer param-group structure
# to match the new module exactly (same architecture/param count/order), since optimizer
# state is restored by position within param_groups, not by name.
# False: for warmstarting into an architecturally different module (e.g. one that adds new
# submodules/params not present in the source checkpoint). Loads only the model weights,
# non-strict (missing keys keep their random init, e.g. a newly added head), manually seeds
# global_step from the checkpoint, and otherwise starts fresh -- new optimizer, new LR
# schedule (from its own step 0, not fast-forwarded to global_step). See main_hydra.py.
warmstart_strict: True

save_step_frequency: 10000
log_freq: 500
limit_val_batches: 1
accumulate_grad_batches: 1
debug: False
limit_examples: 0
mode: train
compile: True  # torch.compile(pl_module.backbone) -- disable for quick interactive smoke tests (skips the slow first-step recompile)
