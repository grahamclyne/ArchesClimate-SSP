# Compares pf8_energy_score_a100_reduced_pf (step-step=032000.ckpt) at the
# default unit-variance energy-score noise (energy_score_noise_scale=1.0,
# implicit -- no override) vs an experimental 1.5x noise scale
# (+inference.energy_score_noise_scale=1.5, see model/forecast.py's
# ForecastModule.forward_multistep docstring), both 5-seed ensembles, no
# forcing ablation (all-forcings baseline), val target (ssp434). Checks
# whether scaling the cond_token noise (a purely linear embedder, so this
# should scale the injected conditioning perturbation exactly
# proportionally) actually buys more ensemble spread without degrading
# RMSE/IAV against the IPSL target.
config_module: deterministic_damip_pf8_energy_score

variable: tas
final_decade_years: 10

climatology:
  realization: r1i1p1f1
  field: lev
  var_idx: 0
  n_clim_years: 20
  skip_last_years: 10

scenarios:
  - key: "434"
    label: "SSP4-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp434
    models:
      noise_1.0x:
        label: "Noise scale 1.0x (default)"
        runs:
          - pf8_energy_score_a100_reduced_pf_12_10_1_1020_1_val_0_step-step=032000.ckpt_ema_clamp3std10
      noise_1.5x:
        label: "Noise scale 1.5x"
        runs:
          - pf8_energy_score_a100_reduced_pf_12_10_1_1020_1_val_0_step-step=032000.ckpt_ema_clamp3std10_nscale1.5

output_name: paper_figures_noise_scale_comparison
