# SSP5-8.5 counterpart to paper_figures_table_seed_stability.yaml: same
# base/seed1/seed2 step-22000 5-member ensembles, black-carbon clamp
# applied, but on ssp585 (target=test, debug=True, surface-only) instead of
# ssp434. No MESMER-M emulation exists for ssp585 (unseen forcing pathway).
config_module: deterministic_damip_pf4_energy_score_w050_80_10

variable: tas
final_decade_years: 10

climatology:
  realization: r1i1p1f1
  field: lev
  var_idx: 0
  n_clim_years: 20
  skip_last_years: 10

scenarios:
  - key: "585"
    label: "SSP5-8.5"
    target:
      realization: r1i1p1f1
      scenario: ssp585
    models:
      base:
        label: "base"
        runs:
          - deterministic_damip_pf4_energy_score_w050_80_10_0_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      seed1:
        label: "seed1"
        runs:
          - deterministic_damip_pf4_energy_score_w050_80_10_seed1_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      seed2:
        label: "seed2"
        runs:
          - deterministic_damip_pf4_energy_score_w050_80_10_seed2_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10

output_name: paper_figures_table_seed_stability_585
