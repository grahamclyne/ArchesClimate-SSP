# Architecture-ablation comparison (sec:architecture_ablations, "Spatial
# Forcing Conditioning" block of tab:architecture_ablations): the three
# spatial-forcing backbone ablations (see model/base_climate_module.py's
# spatial_forcing_mode flag), plus the default (concat+SPADE) model, at their
# _fixed (fully-trained, black-carbon-clamp-validated) checkpoint:
#   - linear ("AdaLN-1D"): forcings enter only as a scalar summed into adaLN
#     conditioning, no spatial structure.
#   - concat ("Concat only"): forcings enter only as extra concatenated
#     encoder input channels, sharing the state tensor's channel space.
#   - spade ("SPADE only"): forcings enter only through the SPADE per-token
#     adaLN pathway.
#   - default: both concat and SPADE simultaneously (deterministic_damip_pf8).
# Only "434" (SSP4-3.4, inference.target=val) and "585" (SSP5-8.5,
# inference.target=test, debug=True/surface-only) rollouts exist on disk for
# these _fixed runs -- no "534" (val3/ssp534-over) rollouts have been
# generated for this comparison, so that scenario block is omitted.
config_module: deterministic_damip_pf8_ablation_concat

variable: tas
final_decade_years: 10

climatology:
  realization: r1i1p1f1
  field: lev
  var_idx: 0
  n_clim_years: 20
  skip_last_years: 10

scenarios:
  - key: "434"
    label: "SSP4-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp434
    mesmer:
      path: /scratch/gclyne/tutorials/emulations_434_all.nc
    models:
      default:
        label: "$AC_{concat+spade}$ (default)"
        runs:
          - deterministic_damip_pf8_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10
      concat:
        label: "$AC_{concat}$"
        runs:
          - deterministic_damip_pf8_ablation_concat_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10
      spade:
        label: "$AC_{spade}$"
        runs:
          - deterministic_damip_pf8_ablation_spade_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10
      linear:
        label: "$AC_{adaln1d}$"
        runs:
          - deterministic_damip_pf8_ablation_linear_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10

  # inference.target=test rollouts (debug=True, surface-only) -- no
  # rollout_lev_*.pt/rollout_level_*.pt, so ocean_rmse_plot.py/physical.py/
  # whisker_plots.py will fail for this scenario; paper_figures_generate_all.py
  # tolerates that and continues. Included so table.py/rmse_plot.py get a 585
  # row and paper_figures_585_analysis.py's extrapolation check runs. No
  # MESMER-M emulation exists for ssp585 (unseen forcing pathway), so no
  # `mesmer` key here.
  - key: "585"
    label: "SSP5-8.5"
    target:
      realization: r1i1p1f1
      scenario: ssp585
    models:
      default:
        label: "$AC_{concat+spade}$ (default)"
        runs:
          - deterministic_damip_pf8_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      concat:
        label: "$AC_{concat}$"
        runs:
          - deterministic_damip_pf8_ablation_concat_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      spade:
        label: "$AC_{spade}$"
        runs:
          - deterministic_damip_pf8_ablation_spade_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      linear:
        label: "$AC_{adaln1d}$"
        runs:
          - deterministic_damip_pf8_ablation_linear_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10

# Side-by-side single-forcing-removed ablation deltas (paper_figures_forced_response.py).
# base_dir_name = each model's val/434 baseline dir *without* the trailing
# clamp suffix -- the forcing-ablation suffixes (_zs0_pi, _zs1_pi, etc.) are
# inserted by long_rollout.py before the clamp suffix, not after it, so the
# clamp suffix is supplied separately via `clamp_suffix` and appended last.
forced_response:
  start_year: 2015
  clamp_suffix: "_clamp3std10"
  models:
    default: deterministic_damip_pf8_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema
    concat: deterministic_damip_pf8_ablation_concat_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema
    spade: deterministic_damip_pf8_ablation_spade_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema
    linear: deterministic_damip_pf8_ablation_linear_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema

output_name: paper_figures_ablations
