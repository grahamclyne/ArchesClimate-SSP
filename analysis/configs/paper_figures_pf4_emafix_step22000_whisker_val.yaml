# Whisker plots (RMSE by pressure level / region) for
# pf8_energy_score_gradfix_w050_pf4_emafix, step-022000.ckpt, EMA,
# energy_score_noise_scale=0.4, SSP4-3.4 (val). Baseline + 5
# single-forcing-removed piControl-counterfactual (_pi) ablations, full
# (level+ocean) save.
config_module: deterministic_damip_pf8_energy_score_w050_nopf_warmstart

final_decade_years: 10

scenarios:
  - key: "434"
    label: "SSP4-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp434
    models:
      full:
        label: "AC-SSP"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10_nscale0.4
      no_co2:
        label: "$AC_{\\neg CO_2}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_zs1_pi_clamp3std10_nscale0.4
      no_methane:
        label: "$AC_{\\neg CH_4}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_zs0_pi_clamp3std10_nscale0.4
      no_n2o:
        label: "$AC_{\\neg N_2O}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_zs2_pi_clamp3std10_nscale0.4
      no_ozone:
        label: "$AC_{\\neg O_3}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_zs9-10-11-12-13-14-15-16-17-18_pi_clamp3std10_nscale0.4
      no_aerosol:
        label: "$AC_{\\neg aero}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_zs3-4-5-6-7-8_pi_clamp3std10_nscale0.4

  - key: "534"
    label: "SSP5-3.4-over"
    target:
      realization: r1i1p1f1
      scenario: ssp534-over
    models:
      full:
        label: "AC-SSP"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_730_1_val3_0_step-step=022000.ckpt_ema_clamp3std10_nscale0.4
      no_co2:
        label: "$AC_{\\neg CO_2}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_730_1_val3_0_step-step=022000.ckpt_ema_zs1_pi_clamp3std10_nscale0.4
      no_methane:
        label: "$AC_{\\neg CH_4}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_730_1_val3_0_step-step=022000.ckpt_ema_zs0_pi_clamp3std10_nscale0.4
      no_n2o:
        label: "$AC_{\\neg N_2O}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_730_1_val3_0_step-step=022000.ckpt_ema_zs2_pi_clamp3std10_nscale0.4
      no_ozone:
        label: "$AC_{\\neg O_3}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_730_1_val3_0_step-step=022000.ckpt_ema_zs9-10-11-12-13-14-15-16-17-18_pi_clamp3std10_nscale0.4
      no_aerosol:
        label: "$AC_{\\neg aero}$"
        runs:
          - pf8_energy_score_gradfix_w050_pf4_emafix_12_10_1_730_1_val3_0_step-step=022000.ckpt_ema_zs3-4-5-6-7-8_pi_clamp3std10_nscale0.4

output_name: paper_figures_pf4_emafix_step22000_whisker_val
