# Example config for analysis/paper_figures_table.py
# To run: python analysis/paper_figures_table.py --config analysis/configs/paper_figures_table_example.yaml
#
# config_module: which hydra module config to compose, purely to get the
# training-set normalization stats (data_mean/data_std) and the
# surface_variables ordering used to denormalize AC rollouts. Any config from
# the same model family as the AC runs below works -- it does not need to be
# the exact config each run was trained with, as long as they share
# normalization stats and variable ordering.
config_module: forcing_dropout_no_random_lt_pf8_no_uncond_grouped_dropout_pilot_full_state_circular_pad_damip

variable: tas

# Metrics are computed over the trailing N years of each scenario's annual
# series (matches global_mean_stats.ipynb's FINAL_DECADE = slice(-10, None),
# i.e. 2090-2100 for scenarios that run through 2100).
final_decade_years: 10

# Historical climatology used to detrend before computing inter-annual
# variability. Mirrors global_mean_stats.ipynb cell 5 exactly (including its
# use of the 'lev' field / var_idx 0 rather than 'surface' -- preserved as-is
# for fidelity with the reference table's methodology).
climatology:
  realization: r1i1p1f1
  field: lev
  var_idx: 0
  n_clim_years: 20
  skip_last_years: 10

scenarios:
  - key: "434"
    label: "SSP4-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp434
    mesmer:
      path: /scratch/gclyne/tutorials/emulations_434_all.nc
    # One entry per comparison row. Each model's `runs` list is one or more
    # rollout folders under {scratch}/generated_data/, stacked as
    # pseudo-ensemble-members (matches the notebook's practice of treating
    # several checkpoints of the same model as extra members). Row order in
    # the table follows this dict's order, then MESMER-M, then IPSL.
    models:
      full:
        label: "AC-SSP"
        runs:
          - new_ozone_flow_lt_1_ens_12_1_1_1020_1_val_0_step-step=024000.ckpt
          - new_ozone_flow_lt_1_ens_12_1_1_1020_1_val_0_step-step=038000.ckpt
      # Add more rows here later, e.g.:
      # no_ghg:
      #   label: "$AC_{\\neg ghg}$"
      #   runs: [...]

  - key: "534"
    label: "SSP5-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp534-over
    mesmer:
      path: /scratch/gclyne/tutorials/emulations_534_all.nc
    models:
      full:
        label: "AC-SSP"
        runs:
          - new_ozone_flow_lt_1_ens_12_1_1_1020_1_val3_0_step-step=024000.ckpt
          - new_ozone_flow_lt_1_ens_12_1_1_1020_1_val3_0_step-step=038000.ckpt

# All outputs (this table, RMSE plots, etc.) are written under
# ./plots/{output_name}/ -- one folder per paper-figures run.
output_name: paper_figures_example
