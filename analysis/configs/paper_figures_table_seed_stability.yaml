# Seed-to-seed stability check for deterministic_damip_pf4_energy_score_w050_80_10
# (p_all=0.8): base, seed1, seed2 -- all step-22000, SSP4-3.4 (val), 5-member
# ensemble each (an independent training seed, not a rollout-noise seed).
config_module: deterministic_damip_pf4_energy_score_w050_80_10

variable: tas
final_decade_years: 10

climatology:
  realization: r1i1p1f1
  field: lev
  var_idx: 0
  n_clim_years: 20
  skip_last_years: 10

scenarios:
  - key: "434"
    label: "SSP4-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp434
    mesmer:
      path: /scratch/gclyne/tutorials/emulations_434_all.nc
    models:
      base:
        label: "base"
        runs:
          - deterministic_damip_pf4_energy_score_w050_80_10_0_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10
      seed1:
        label: "seed1"
        runs:
          - deterministic_damip_pf4_energy_score_w050_80_10_seed1_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10
      seed2:
        label: "seed2"
        runs:
          - deterministic_damip_pf4_energy_score_w050_80_10_seed2_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10

output_name: paper_figures_table_seed_stability_clamped
