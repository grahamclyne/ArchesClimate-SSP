# Full paper_figures_generate_all.py run comparing the pf_n_steps
# (pushforward rollout length during training) ablation for the IPSL damip
# model family: pf2, pf4, pf8, pf16 -- see model/base_climate_module.py's
# pf_n_steps config knob, at each run's _fixed (fully-trained, black-carbon-
# clamp-validated) step-022000 checkpoint. Only val (ssp434, debug=False,
# full rollout_level_*/rollout_lev_*/rollout_surface_*) and test (ssp585,
# debug=True, surface-only) rollouts exist for these four runs -- no val3
# (ssp534-over) and no zero-forcing (_zs*) ablation runs, so global_mean/
# hovmoller (need 434+534) and forced_response (needs _zs* runs) are skipped
# by paper_figures_generate_all.py; everything else (table, rmse_plot,
# ocean_rmse_plot, physical, whisker_plots for 434, table/rmse_plot/
# 585_analysis for 585) runs.
config_module: deterministic_damip_pf8

variable: tas
final_decade_years: 5

climatology:
  realization: r1i1p1f1
  field: lev
  var_idx: 0
  n_clim_years: 20
  skip_last_years: 10

scenarios:
  - key: "434"
    label: "SSP4-3.4"
    target:
      realization: r1i1p1f1
      scenario: ssp434
    mesmer:
      path: /scratch/gclyne/tutorials/emulations_434_all.nc
    models:
      pf2:
        label: "$AC_{pf2}$ (energy-score)"
        runs:
          - deterministic_damip_pf2_energy_score_w050_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema
      pf4:
        label: "$AC_{pf4}$ (energy-score)"
        runs:
          - deterministic_damip_pf4_energy_score_w050_0_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema
      pf8:
        label: "$AC_{pf8}$ (default, energy-score)"
        runs:
          - deterministic_damip_pf8_energy_score_w050_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema
      pf16:
        label: "$AC_{pf16}$"
        runs:
          - deterministic_damip_pf16_fixed_12_10_1_1020_1_val_0_step-step=022000.ckpt_ema_clamp3std10

  # inference.target=test rollouts (debug=True, surface-only) -- no
  # rollout_lev_*.pt/rollout_level_*.pt, so ocean_rmse_plot.py/physical.py/
  # whisker_plots.py will fail for this scenario; paper_figures_generate_all.py
  # tolerates that and continues. Included so table.py/rmse_plot.py get a 585
  # row and paper_figures_585_analysis.py's extrapolation check runs. No
  # MESMER-M emulation exists for ssp585 (unseen forcing pathway), so no
  # `mesmer` key here.
  - key: "585"
    label: "SSP5-8.5"
    target:
      realization: r1i1p1f1
      scenario: ssp585
    models:
      pf2:
        label: "$AC_{pf2}$"
        runs:
          - deterministic_damip_pf2_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      pf4:
        label: "$AC_{pf4}$"
        runs:
          - deterministic_damip_pf4_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      pf8:
        label: "$AC_{pf8}$ (default)"
        runs:
          - deterministic_damip_pf8_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10
      pf16:
        label: "$AC_{pf16}$"
        runs:
          - deterministic_damip_pf16_fixed_12_10_1_1020_1_test_0_step-step=022000.ckpt_ema_clamp3std10

output_name: paper_figures_pf_ablations_5yr
