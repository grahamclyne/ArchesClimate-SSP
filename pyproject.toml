[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archesclimate"
version = "0.1.0"
description = "ArchesClimate-SSP: a Swin-Transformer-based autoregressive climate emulator for CMIP6 SSP scenarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "lightning>=2.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tensordict>=0.9",
    "timm>=1.0",
    "torchmetrics>=1.4",
    "diffusers>=0.30",
    "submitit>=1.5",
    "huggingface_hub>=0.24",
    "wandb>=0.17",
    "xarray>=2024.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "cftime>=1.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "lovely-tensors>=0.1",
    "lovely-numpy>=0.2",
]

[project.optional-dependencies]
# Needed only for backbone.axis_attn=True configs (not used by any current
# module config -- see backbones/archesweather_layers.py's EarthSpecificBlock).
axial = ["axial-attention>=0.6"]

[tool.setuptools]
# This repo's own root is the "ArchesClimate" package -- every module does
# `from ArchesClimate.model...`/`from ArchesClimate.backbones...`, regardless
# of what directory name you actually clone this repo into. model/,
# backbones/, dataloaders/, metrics/, utils/ are implicit namespace
# subpackages (no __init__.py needed); stats/ has one so
# importlib.resources.files(ArchesClimate.stats) resolves correctly under an
# editable install.
packages = [
    "ArchesClimate",
    "ArchesClimate.model",
    "ArchesClimate.backbones",
    "ArchesClimate.backbones.weatherlearn_utils",
    "ArchesClimate.dataloaders",
    "ArchesClimate.metrics",
    "ArchesClimate.utils",
    "ArchesClimate.stats",
]

[tool.setuptools.package-dir]
"ArchesClimate" = "."
"ArchesClimate.model" = "model"
"ArchesClimate.backbones" = "backbones"
"ArchesClimate.backbones.weatherlearn_utils" = "backbones/weatherlearn_utils"
"ArchesClimate.dataloaders" = "dataloaders"
"ArchesClimate.metrics" = "metrics"
"ArchesClimate.utils" = "utils"
"ArchesClimate.stats" = "stats"
