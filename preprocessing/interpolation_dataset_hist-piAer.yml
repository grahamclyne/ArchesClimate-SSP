documentation:
  title: Download and regrid CMIP6 variables into one NetCDF
  description: Download variables from IPSL-CM6A-LR, regrid to same grid, and combine output
  authors:
    - butchart_neal

datasets:

  # AerChemMIP single-forcing historical run: all forcings held at their
  # historical evolution EXCEPT aerosol emissions/concentrations, which are
  # held fixed at pre-industrial (piControl) levels -- the counterfactual
  # complement of DAMIP's hist-aer (interpolation_dataset_hist-aer.yml,
  # which does the opposite: aerosols follow their historical evolution,
  # everything else held at pre-industrial). Not part of DAMIP -- must set
  # activity: AerChemMIP or ESGF search won't find it.
  # Verified against ESGF (esgf-node.llnl.gov/esg-search, redirects to
  # esgf-node.ornl.gov/esgf-1-5-bridge): IPSL-CM6A-LR contributes only
  # r1i1p1f1 (unlike hist-aer's r1..r10), 1850-01 onward, with
  # tas/psl/pr/uas/vas/ps/thetao/hfss/hfls/huss/rlds/rsds/rsus/rlus/evspsbl/
  # hus/ta/ua/va/zg all present. CanESM5 does not contribute this experiment
  # at all, so there is no CanESM5 counterpart recipe here (unlike hist-aer/
  # hist-GHG/hist-stratO3, which both models provide).
  # IPSL splits grid_label by realm here (same as historical/abrupt-4xCO2/
  # hist-aer): atmosphere variables (tas, ta, ...) are 'gr', but thetao
  # (ocean, Omon) is 'gn' -- confirmed via esgf-data.dkrz.de/esg-search. No
  # single grid value satisfies both, so use the wildcard.
  - project: CMIP6
    activity: AerChemMIP
    dataset: IPSL-CM6A-LR
    exp: hist-piAer
    ensemble: r1i1p1f1
    grid: '*'
    start_year: 1850
    end_year: 2014

preprocessors:
  process_var:
    regrid:
      target_grid: "2.5x1.25"   # native grid of IPSL-CM6A-LR; or choose '2.5x2.5' etc.
      scheme: area_weighted
diagnostics:
  regrid_and_combine:
    variables:
      #surface
      tas:     {mip: Amon, frequency: mon, preprocessor: process_var}
      psl:     {mip: Amon, frequency: mon, preprocessor: process_var}
      pr:      {mip: Amon, frequency: mon, preprocessor: process_var}
      uas:     {mip: Amon, frequency: mon, preprocessor: process_var}
      vas:      {mip: Amon, frequency: mon, preprocessor: process_var}
      ps:      {mip: Amon, frequency: mon, preprocessor: process_var}

      #ocean
      thetao:    {mip: Omon, frequency: mon, preprocessor: process_var}

      # #fluxes
      hfss:    {mip: Amon, frequency: mon, preprocessor: process_var}
      hfls:    {mip: Amon, frequency: mon, preprocessor: process_var}
      huss:    {mip: Amon, frequency: mon, preprocessor: process_var}
      rlds:    {mip: Amon, frequency: mon, preprocessor: process_var}
      rsds:    {mip: Amon, frequency: mon, preprocessor: process_var}
      rsus:    {mip: Amon, frequency: mon, preprocessor: process_var}
      rlus:    {mip: Amon, frequency: mon, preprocessor: process_var}
      evspsbl: {mip: Amon, frequency: mon, preprocessor: process_var}

      # #atmospheric
      hus: {mip: Amon, frequency: mon, preprocessor: process_var}
      ta: {mip: Amon, frequency: mon, preprocessor: process_var}
      ua: {mip: Amon, frequency: mon, preprocessor: process_var}
      va: {mip: Amon, frequency: mon, preprocessor: process_var}
      zg: {mip: Amon, frequency: mon, preprocessor: process_var}

    scripts:
      my_diagnostic:
        script: /home/gclyne/ArchesClimate/ArchesClimate/preprocessing/prepare_interpol_dataset.py

# to run:  esmvaltool run interpolation_dataset_hist-piAer.yml --search_esgf=when_missing
